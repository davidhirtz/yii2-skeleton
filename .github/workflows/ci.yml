name: CI

# On demand only: the release script dispatches this before it tags, and nothing runs on a push. The work is
# in bundle-ci.yml, which every bundle shares; this one calls it by path because the skeleton is where it lives.

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/bundle-ci.yml
